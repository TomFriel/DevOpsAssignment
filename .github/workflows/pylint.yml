name: Pylint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pylint
        run: |
          python -m pip install -U pip
          python -m pip install pylint

      - name: Analyse code with Pylint (no rcfile)
        run: |
          pylint \
            --fail-under=6.0 \
            --disable=C0114,C0115,C0116,R0903,C0303,C0304,C0305 \
            --max-line-length=100 \
            $(git ls-files '*.py')
