name: Pylint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pylint
        run: |
          python -m pip install -U pip
          python -m pip install pylint

      - name: Analyse code with Pylint
        run: |
          # Use your repo config and a sane threshold while you stabilize
          pylint --rcfile=.pylintrc --fail-under=6.0 $(git ls-files '*.py')
